openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Habit Journey API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Current user profile and onboarding
  - name: habits
    description: Habit CRUD
  - name: checkins
    description: Daily habit check-ins and streak recovery
  - name: timeEntries
    description: Free-form time tracking
  - name: memories
    description: Photo/note journal entries
  - name: rewards
    description: User-defined real-world rewards
  - name: wallet
    description: Coin balance and transaction history
  - name: character
    description: Character catalog, ownership, and equipping
  - name: decorations
    description: Coin-purchasable island decorations and habit placements
  - name: journey
    description: Level/XP journey map progress
  - name: dashboard
    description: Aggregate "safe wow" summary endpoints
  - name: daily
    description: Durable daily habit execution, reflection, and consistency
  - name: groups
    description: Simplified social challenges
  - name: social
    description: Private-by-default friends, sharing, encouragement, challenges, and invite-only circles
  - name: ai
    description: Hybrid rule-engine + LLM coach endpoints
  - name: Storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current user profile (JIT-provisions on first call)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile / onboarding fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits for the current user
      parameters:
        - name: isActive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Habit" }
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }

  /habits/{habitId}:
    get:
      operationId: getHabit
      tags: [habits]
      summary: Get a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        "409":
          description: The habit target has changed since the expected target value was read; request a new suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/journey:
    get:
      operationId: getHabitJourney
      tags: [habits]
      summary: Get the habit-specific 22-day journey and scheduled thresholds
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Journey and its per-day plans; legacy habits may have no journey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitJourney" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: startHabitJourney
      tags: [habits]
      summary: Start an existing legacy habit's 22-calendar-day journey
      description: >
        Starts at today in the owner's timezone using the habit's stored plan and cadence.
        The operation is idempotent: an existing journey is returned unchanged. The server
        owns all dates and plan snapshots; no check-in rewards or journey unlocks are granted.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartHabitJourneyInput" }
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Started journey or the existing journey, unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitJourney" }
        "400":
          description: The existing journey definition is incomplete or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/daily/{date}:
    get:
      operationId: getDailyHabitDay
      tags: [daily]
      summary: Get a habit's durable execution state and immutable plan for a local date
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily execution and consistency state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHabitState" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Date is outside the journey or not eligible for execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/daily/actions:
    post:
      operationId: changeDailyHabitExecution
      tags: [daily]
      summary: Start, pause, resume, finish, update progress, or complete today's habit execution
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyHabitExecutionInput" }
      responses:
        "200":
          description: Durable execution state and any new reward delta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHabitActionResult" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Stale revision, invalid state transition, future date, or rest day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/daily/{date}/reflection:
    patch:
      operationId: saveDailyHabitReflection
      tags: [daily]
      summary: Save completion reflection or a real missed-day reason
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyHabitReflectionInput" }
      responses:
        "200":
          description: Updated execution, check-in if successful, and actual newly granted rewards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHabitActionResult" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Date cannot be reflected or completion is not eligible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/daily/{date}/adaptation-decision:
    post:
      operationId: recordDailyAdaptationDecision
      tags: [daily]
      summary: Persist whether the user accepted or rejected the adaptation shown for a day
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyAdaptationDecisionInput" }
      responses:
        "200":
          description: Persisted adaptation decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHabitState" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Date has no persisted missed-day adaptation context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /daily/overview:
    get:
      operationId: getDailyOverview
      tags: [daily]
      summary: Aggregate elapsed scheduled dates, today's execution, and reward milestones by active habit
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Per-habit daily consistency summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyOverview" }

  /checkins:
    get:
      operationId: listHabitCheckins
      tags: [checkins]
      summary: List check-ins for a habit
      parameters:
        - name: habitId
          in: query
          required: true
          schema: { type: integer }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Check-ins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Checkin" }

  /habits/{habitId}/checkins:
    post:
      operationId: createCheckin
      tags: [checkins]
      summary: Record a check-in for a habit (updates streak and awards coins)
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckinResult" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A successful check-in cannot be changed to incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/checkins/{date}:
    patch:
      operationId: updateCheckinReflection
      tags: [checkins]
      summary: Add or update reflection and missed-day reason for a recorded check-in
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinReflection" }
      responses:
        "200":
          description: Updated reflection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/adaptation:
    get:
      operationId: getHabitAdaptation
      tags: [habits]
      summary: Deterministic habit target suggestion based on check-in history
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Adaptation suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitAdaptation" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/recover-streak:
    post:
      operationId: recoverStreak
      tags: [checkins]
      summary: Spend coins to restore a just-broken streak
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Streak recovered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoverStreakResult" }
        "400":
          description: Not eligible or insufficient coins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [timeEntries]
      summary: List time entries
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: habitId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Time entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeEntry" }
    post:
      operationId: createTimeEntry
      tags: [timeEntries]
      summary: Log a time entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }

  /time-entries/summary:
    get:
      operationId: getTimeEntriesSummary
      tags: [timeEntries]
      summary: Get total minutes tracked on a given day, grouped by habit
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntriesSummary" }

  /time-entries/{timeEntryId}:
    patch:
      operationId: updateTimeEntry
      tags: [timeEntries]
      summary: Correct an existing time entry
      parameters:
        - name: timeEntryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeEntryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }
    delete:
      operationId: deleteTimeEntry
      tags: [timeEntries]
      summary: Delete a time entry
      parameters:
        - name: timeEntryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /time-tracking/session:
    get:
      operationId: getTrackingSession
      tags: [timeEntries]
      summary: Get the current day's tracking state
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Session or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingSessionResult" }
    post:
      operationId: changeTrackingSession
      tags: [timeEntries]
      summary: Start, pause, resume, finish, or change the tracking interval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackingSessionInput" }
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingSessionResult" }

  /time-tracking/check-in:
    post:
      operationId: createTrackingCheckin
      tags: [timeEntries]
      summary: Explicitly record activity for one chosen tracking interval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackingCheckinInput" }
      responses:
        "201":
          description: Recorded interval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }

  /time-tracking/day:
    get:
      operationId: getTrackedDay
      tags: [timeEntries]
      summary: Timeline and deterministic category totals for a day
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Tracked day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedDay" }

  /time-tracking/analysis:
    get:
      operationId: getTrackedDayAnalysis
      tags: [timeEntries]
      summary: Supportive analysis of a completed or in-progress tracked day
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Day analysis with deterministic fallback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedDayAnalysis" }

  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List the current owner's private memories
      description: >
        Returns only memories owned by the authenticated user. Memories created by
        the journey flow are private and associated with a completed saved day;
        legacy entries without a saved-day association remain unlinked.
      parameters:
        - name: habitId
          in: query
          required: false
          schema: { type: integer }
          description: Filter by habit; the current journey identity is the habit ID.
        - name: journeyId
          in: query
          required: false
          schema: { type: integer }
          description: >
            Current journey identity (the owning habit ID). If habitId is also
            supplied, both filters must match.
      responses:
        "200":
          description: Owner-scoped private memories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Memory" }
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a private photo memory for a completed journey day
      description: >
        The server derives the owned journey day from habitId and the user's
        local calendar date. The day must have a saved plan snapshot and a real
        successful check-in. Do not send a user ID, journey ID, habit-day ID,
        check-in ID, or day number. Memory creation is separate from habit
        completion and never grants or changes rewards. Only private visibility
        is writable in this version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "201":
          description: Created private memory with server-derived journey context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "400":
          description: Invalid input, unsupported visibility, or day is not eligible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Uploaded photo is not owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Habit or uploaded photo was not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: This saved journey day already has a memory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Uploaded photo exceeds the memory image size limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: Uploaded photo is not a supported image format
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /memories/{memoryId}:
    get:
      operationId: getMemory
      tags: [memories]
      summary: Get an owner-only private memory
      parameters:
        - name: memoryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Private memory and saved journey-day context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "404":
          description: Memory not found or not owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateMemory
      tags: [memories]
      summary: Update a private memory caption
      description: >
        Caption-only edit; image, date, journey/day association, and visibility
        cannot be changed. The deprecated note input is accepted as a caption
        alias for legacy clients when caption is omitted.
      parameters:
        - name: memoryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryUpdate" }
      responses:
        "200":
          description: Updated caption
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
        "400":
          description: Invalid caption
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Memory not found or not owned by the authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete an owner-only private memory
      description: Deleting a memory does not change habit completion, journey progress, XP, or coins.
      parameters:
        - name: memoryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rewards:
    get:
      operationId: listRewards
      tags: [rewards]
      summary: List rewards defined by the user
      responses:
        "200":
          description: Rewards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reward" }
    post:
      operationId: createReward
      tags: [rewards]
      summary: Create a reward
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }

  /rewards/{rewardId}:
    patch:
      operationId: updateReward
      tags: [rewards]
      summary: Update a reward
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteReward
      tags: [rewards]
      summary: Delete a reward
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rewards/{rewardId}/redeem:
    post:
      operationId: redeemReward
      tags: [rewards]
      summary: Redeem a reward by spending coins
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedeemRewardResult" }
        "400":
          description: Insufficient coins or already redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /journey-rewards:
    get:
      operationId: listJourneyRewards
      tags: [rewards]
      summary: List the current owner's private real-world journey rewards and history
      responses:
        "200":
          description: Owner-only journey rewards, including unattached pending rewards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JourneyReward" }
    post:
      operationId: createJourneyReward
      tags: [rewards]
      summary: Create a private physical or experience reward, optionally attaching it to an existing journey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JourneyRewardCreateInput" }
      responses:
        "201":
          description: Created pending journey reward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyReward" }
        "400":
          description: Invalid reward or attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The selected journey already has a real-world reward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /journey-rewards/{journeyRewardId}:
    get:
      operationId: getJourneyReward
      tags: [rewards]
      summary: Read one of the current owner's private real-world journey rewards
      parameters:
        - name: journeyRewardId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Owner's journey reward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyReward" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateJourneyReward
      tags: [rewards]
      summary: Update a pending journey reward after explicit user confirmation
      parameters:
        - name: journeyRewardId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JourneyRewardUpdateInput" }
      responses:
        "200":
          description: Updated pending journey reward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyReward" }
        "400":
          description: Confirmation was not provided or the update is invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Only pending rewards can be updated or the selected journey already has a reward
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /journey-rewards/{journeyRewardId}/claim:
    post:
      operationId: claimJourneyReward
      tags: [rewards]
      summary: Record the owner's claim of an unlocked personal reward without payment or coin spending
      parameters:
        - name: journeyRewardId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Claimed reward; repeated claims return the same claimed state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyReward" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The reward has not been unlocked by eligible server-side journey completion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get coin balance and weekly earn/spend totals
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }

  /wallet/transactions:
    get:
      operationId: listWalletTransactions
      tags: [wallet]
      summary: List recent coin transactions
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CoinTransaction" }

  /character/catalog:
    get:
      operationId: listCharacterCatalog
      tags: [character]
      summary: List all character items with owned/equipped/affordable state
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CharacterItem" }

  /character/me:
    get:
      operationId: getMyCharacter
      tags: [character]
      summary: Get current level/XP and equipped loadout
      responses:
        "200":
          description: My character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCharacter" }

  /character/items/{itemId}/purchase:
    post:
      operationId: purchaseCharacterItem
      tags: [character]
      summary: Purchase a character item with coins
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Purchased
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterItem" }
        "400":
          description: Invalid request, insufficient coins, insufficient level, or invalid item price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Item not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Item already owned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /character/items/{itemId}/equip:
    post:
      operationId: equipCharacterItem
      tags: [character]
      summary: Equip an owned character item
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Equipped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterItem" }
        "400":
          description: Invalid request or item not owned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Item not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /character/items/{itemId}/unequip:
    post:
      operationId: unequipCharacterItem
      tags: [character]
      summary: Unequip an owned character item
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unequipped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterItem" }
        "400":
          description: Invalid request or item not owned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Item not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /decorations/catalog:
    get:
      operationId: listDecorationCatalog
      tags: [decorations]
      summary: List purchasable island decorations and ownership state
      responses:
        "200":
          description: Decoration catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DecorationItem" }

  /decorations/items/{itemId}/purchase:
    post:
      operationId: purchaseDecorationItem
      tags: [decorations]
      summary: Purchase a decoration with coins
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecorationPurchaseInput" }
      responses:
        "200":
          description: Purchased, already owned, or an idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecorationPurchase" }
        "400":
          description: Invalid input or insufficient coins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Decoration not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency key was committed for a different decoration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/decorations:
    get:
      operationId: getHabitDecorations
      tags: [decorations]
      summary: Get a habit's island decoration placements
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Habit decoration placements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitDecorations" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/decorations/{itemId}:
    put:
      operationId: placeHabitDecoration
      tags: [decorations]
      summary: Place or move an owned decoration in a bounded island slot
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitDecorationPlacementInput" }
      responses:
        "200":
          description: Placed decoration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyDecoration" }
        "400":
          description: Invalid island or slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Habit, decoration, or ownership not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Island slot is occupied by another decoration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: removeHabitDecoration
      tags: [decorations]
      summary: Remove a habit decoration placement without refunding or revoking ownership
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed (including when no placement existed)
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /journey/progress:
    get:
      operationId: getJourneyProgress
      tags: [journey]
      summary: Get level/XP and milestone map progress
      responses:
        "200":
          description: Journey progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyProgress" }

  /dashboard/today:
    get:
      operationId: getDashboardToday
      tags: [dashboard]
      summary: Aggregate home-screen summary for today
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardToday" }

  /dashboard:
    get:
      operationId: getDashboardHome
      tags: [dashboard]
      summary: Read-only timezone-aware home dashboard projection
      responses:
        "200":
          description: Dashboard home projection; secondary sections may independently be unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardHome" }
        "500":
          description: Authenticated profile could not be loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /dashboard/calendar:
    get:
      operationId: getDashboardCalendar
      tags: [dashboard]
      summary: Daily completion heatmap data for a calendar month
      parameters:
        - name: month
          in: query
          required: true
          description: "Format YYYY-MM"
          schema: { type: string }
      responses:
        "200":
          description: Calendar days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DashboardCalendarDay" }

  /social/me:
    get:
      operationId: getSocialMe
      tags: [social]
      summary: Get the current user's social account and profile-sharing preferences
      description: Username is nullable until chosen. Character and achievement sharing default to private and are changed through the resource sharing endpoint.
      responses:
        "200":
          description: Current social account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialMe" }
    patch:
      operationId: updateSocialMe
      tags: [social]
      summary: Set or change the current user's unique username
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialMeUpdate" }
      responses:
        "200":
          description: Updated social account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialMe" }
        "409":
          description: Username is already taken
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/users/search:
    get:
      operationId: searchSocialUsers
      tags: [social]
      summary: Search a narrow safe user DTO by username
      description: Username-only search; requires at least two characters. Never returns email, habit, reward, or activity data.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 24 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Matching users visible to the current user
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialUserSearchResult" }

  /social/friends:
    get:
      operationId: listSocialFriends
      tags: [social]
      summary: List accepted friends
      responses:
        "200":
          description: Safe friend summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialFriend" }

  /social/friend-requests/incoming:
    get:
      operationId: listIncomingSocialFriendRequests
      tags: [social]
      summary: List pending requests addressed to the current user
      responses:
        "200":
          description: Incoming requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialFriendRequest" }

  /social/friend-requests/outgoing:
    get:
      operationId: listOutgoingSocialFriendRequests
      tags: [social]
      summary: List pending requests sent by the current user
      responses:
        "200":
          description: Outgoing requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialFriendRequest" }

  /social/friend-requests:
    post:
      operationId: sendSocialFriendRequest
      tags: [social]
      summary: Send a friend request by target user ID
      description: Server verifies the target, existing relationship, and both block directions; self-requests are invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialFriendRequestInput" }
      responses:
        "201":
          description: Pending request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialFriendRequest" }
        "409":
          description: A request or friendship already exists, or the users are blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/friend-requests/{requestId}/respond:
    post:
      operationId: respondToSocialFriendRequest
      tags: [social]
      summary: Accept or decline an incoming friend request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialFriendRequestResponse" }
      responses:
        "200":
          description: Updated request; accepting creates one canonical friendship
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialFriendRequest" }
        "404":
          description: Request not found or not addressed to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Request is no longer pending or a block exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/friend-requests/{requestId}:
    delete:
      operationId: cancelSocialFriendRequest
      tags: [social]
      summary: Cancel the current user's pending outgoing request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Canceled
        "404":
          description: Request not found, not owned by the current user, or not pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/friends/{friendUserId}:
    delete:
      operationId: removeSocialFriend
      tags: [social]
      summary: Remove an accepted friendship in either direction
      parameters:
        - name: friendUserId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Friendship removed; sharing permissions no longer grant access
        "404":
          description: Friendship not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/blocks:
    get:
      operationId: listSocialBlocks
      tags: [social]
      summary: List users blocked by the current user
      responses:
        "200":
          description: Blocked safe user summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialUserSummary" }
    post:
      operationId: createSocialBlock
      tags: [social]
      summary: Block a user and end any friendship or pending requests between them
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialBlockInput" }
      responses:
        "201":
          description: Block created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialBlock" }
        "404":
          description: Target user not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/blocks/{blockedUserId}:
    delete:
      operationId: removeSocialBlock
      tags: [social]
      summary: Unblock a user
      parameters:
        - name: blockedUserId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Block removed
        "404":
          description: Block not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/reports:
    post:
      operationId: createSocialReport
      tags: [social]
      summary: Persist a report about a user for human review
      description: Reports are not transmitted to an AI moderation service.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialReportInput" }
      responses:
        "201":
          description: Report stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialReportReceipt" }
        "404":
          description: Reported user not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/profiles/{userId}:
    get:
      operationId: getSocialProfile
      tags: [social]
      summary: Get only information explicitly shared with the current user
      description: >
        Response is limited to safe identity, explicitly shared equipped character,
        achievements, visible journey summaries, shared Memories, and explicitly
        shared rewards. Access is directional: either accepted friendship plus
        friends visibility, or a selected-user ACL. A block in either direction
        denies the entire request. No time logs, cues, private habits, missed
        days/reasons, precise location, reward values, or private Memory fields.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Narrow safe profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialProfile" }
        "404":
          description: Profile does not exist or has no information shared with the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: A block denies access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/sharing/{resourceType}/{resourceId}:
    get:
      operationId: getSocialResourceSharing
      tags: [social]
      summary: Get the current owner's ACL for one resource
      description: >
        Owner only. Unknown ACL rows mean private. journey resourceId is the habit
        ID; profile preferences use resourceId "profile" for character and
        achievements. selectedUserIds are explicit recipients, never public.
      parameters:
        - name: resourceType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/SocialResourceType" }
        - name: resourceId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Existing ACL or synthesized private default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialSharing" }
        "404":
          description: Resource does not exist or is not owned by the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateSocialResourceSharing
      tags: [social]
      summary: Change private/friends/selected sharing for an owned resource
      description: >
        Public visibility is not supported. selectedUserIds is required when
        visibility is selected and must name allowed recipients; omitted or empty
        selectedUserIds for private/friends clears recipient rows.
      parameters:
        - name: resourceType
          in: path
          required: true
          schema: { $ref: "#/components/schemas/SocialResourceType" }
        - name: resourceId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialSharingUpdate" }
      responses:
        "200":
          description: Updated ACL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialSharing" }
        "400":
          description: Unsupported visibility or invalid recipient list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Resource does not exist or is not owned by the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/memories/{memoryId}/photo:
    get:
      operationId: getSocialMemoryPhoto
      tags: [social]
      summary: Stream a Memory photo only after evaluating its explicit ACL
      description: >
        Private object bytes are returned only to the owner or a currently
        authorized recipient. Friendship and block state are checked on every
        request. Never return a public URL or use the unconditional public object
        route for Memory photos.
      parameters:
        - name: memoryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Authorized image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: Memory/photo unavailable or not visible to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/activity:
    get:
      operationId: listSocialActivity
      tags: [social]
      summary: List recent successful friend activity
      description: Only successful days, milestones, and journey completions are eligible. Missed days and private details have no event contract.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: beforeId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Visible positive activity events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialActivity" }

  /social/encouragements:
    post:
      operationId: createSocialEncouragement
      tags: [social]
      summary: Send one short positive encouragement to an authorized friend
      description: >
        Receiver must be an accepted friend; an optional journeyId must identify
        a journey currently shared with the sender. A custom message is at most
        120 characters. A persisted requestId makes retries idempotent and the
        database enforces a sender/recipient minute cooldown. This grants no XP,
        coins, rewards, or other progress.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialEncouragementInput" }
      responses:
        "201":
          description: Encouragement recorded and recipient notified once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialEncouragement" }
        "403":
          description: Recipient is not an accepted friend or is blocked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Recipient or requested shared journey not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Cooldown or requestId prevents a duplicate encouragement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/notifications:
    get:
      operationId: listSocialNotifications
      tags: [social]
      summary: List the current user's persisted social notifications
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: beforeId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialNotification" }

  /social/notifications/{notificationId}/read:
    patch:
      operationId: markSocialNotificationRead
      tags: [social]
      summary: Mark one owned notification read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialNotification" }
        "404":
          description: Notification not found or not owned by the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/notifications/read-all:
    patch:
      operationId: markAllSocialNotificationsRead
      tags: [social]
      summary: Mark all current-user notifications read
      responses:
        "200":
          description: Count of notifications newly marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialReadAllResult" }

  /social/challenges:
    get:
      operationId: listSocialChallenges
      tags: [social]
      summary: List challenges involving the current user
      responses:
        "200":
          description: Own challenges and invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialChallengeSummary" }
    post:
      operationId: createSocialChallenge
      tags: [social]
      summary: Create an invite-only 22-day challenge from the current user's own habit
      description: >
        The server verifies ownership of sourceHabitId and snapshots only safe
        habit template fields (title, emoji, category, cadence, unit, execution
        type, goal type, difficulty, suggested target/minimum). Cues, friction,
        time tracking, missed reasons, rewards, and XP/coins are never copied or
        shared. The creator remains linked to their own habit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialChallengeInput" }
      responses:
        "201":
          description: Created challenge with the creator as its first participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialChallengeDetail" }
        "404":
          description: Source habit not found or not owned by the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/challenges/{challengeId}:
    get:
      operationId: getSocialChallenge
      tags: [social]
      summary: Get a challenge and safe progress for accepted participants
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Challenge visible to its creator, invitee, or participant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialChallengeDetail" }
        "404":
          description: Challenge not found or not visible to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/challenges/{challengeId}/invitations:
    post:
      operationId: inviteUsersToSocialChallenge
      tags: [social]
      summary: Invite existing friends to a challenge
      description: Invites create pending memberships only; each invitee must accept before their separate owned habit and journey are created.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialChallengeInviteInput" }
      responses:
        "201":
          description: Created invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialChallengeMember" }
        "403":
          description: Only the challenge creator can invite, or a target is not a friend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Challenge or invitee not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/challenges/{challengeId}/respond:
    post:
      operationId: respondToSocialChallenge
      tags: [social]
      summary: Accept or decline the current user's challenge invitation
      description: >
        Accept creates a distinct owned habit, derives the current timezone and
        local start date from the authenticated user, and persists 22 immutable
        habit_days snapshots. Target/minimum/cadence may be personalized. The new
        habit has no reward and no private cues copied from the inviter.
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialChallengeResponse" }
      responses:
        "200":
          description: Updated membership and safe challenge detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialChallengeDetail" }
        "404":
          description: Invitation not found or not addressed to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invitation is no longer pending or challenge is closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/challenges/{challengeId}/leave:
    post:
      operationId: leaveSocialChallenge
      tags: [social]
      summary: Leave a challenge without deleting or changing the user's own habit
      parameters:
        - name: challengeId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Updated challenge membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialChallengeDetail" }
        "404":
          description: Challenge membership not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/groups:
    get:
      operationId: listSocialGroups
      tags: [social]
      summary: List invite-only groups the current user belongs to
      responses:
        "200":
          description: Safe group summaries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialGroupSummary" }
    post:
      operationId: createSocialGroup
      tags: [social]
      summary: Create a private invite-only circle
      description: Owner is auto-added as the first member. maxMembers is configurable from 2 to 30; membership does not share any habits or check-ins.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialGroupInput" }
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialGroupDetail" }

  /social/groups/{groupId}:
    get:
      operationId: getSocialGroup
      tags: [social]
      summary: Get an invite-only group and only members' explicitly shared journeys
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Group detail visible to current members only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialGroupDetail" }
        "404":
          description: Group not found or current user is not a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/groups/{groupId}/invitations:
    post:
      operationId: inviteUsersToSocialGroup
      tags: [social]
      summary: Invite existing friends to an invite-only group
      description: Only existing members may invite; the server enforces the configured member cap and block state.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialGroupInviteInput" }
      responses:
        "201":
          description: Created pending invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialGroupInvitation" }
        "403":
          description: Inviter is not a member or target is not an eligible friend
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Group or invitee not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invitation would exceed the configured member limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/group-invitations/{invitationId}/respond:
    post:
      operationId: respondToSocialGroupInvitation
      tags: [social]
      summary: Accept or decline an invite-only group invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialGroupInvitationResponse" }
      responses:
        "200":
          description: Updated invitation; accept joins the group without sharing any journey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialGroupInvitation" }
        "404":
          description: Invitation not found or not addressed to the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invitation is no longer pending or group has reached its member limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/group-invitations/incoming:
    get:
      operationId: listIncomingSocialGroupInvitations
      tags: [social]
      summary: List pending invite-only group invitations addressed to the current user
      responses:
        "200":
          description: Incoming group invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialGroupInvitation" }

  /social/groups/{groupId}/leave:
    post:
      operationId: leaveSocialGroup
      tags: [social]
      summary: Leave a group; leaving an owner-only group closes it
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Membership ended and this user's per-group journey shares were deleted
        "404":
          description: Group not found or user is not a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/groups/{groupId}/activity:
    get:
      operationId: listSocialGroupActivity
      tags: [social]
      summary: List positive group activity after enforcing each member's per-group journey consent
      description: May contain member_joined, successful_day, milestone, and journey_completed only; never a missed-day, failure reason, cue, or private time record.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Recent group activity for current members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialGroupActivity" }
        "404":
          description: Group not found or current user is not a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/groups/{groupId}/shares:
    get:
      operationId: listMySocialGroupJourneyShares
      tags: [social]
      summary: List the current user's explicit per-group journey shares
      description: This endpoint lists only the authenticated user's own choices; group membership alone grants no check-in or journey access.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: My journeys shared with this group
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialGroupJourneyShare" }
        "404":
          description: Group not found or current user is not a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: shareMyJourneyWithSocialGroup
      tags: [social]
      summary: Explicitly share one of the current user's journeys with a group
      description: The server validates habit ownership and group membership; sharing exposes only safe success progress, never cues, missed days, or time logs.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialGroupJourneyShareInput" }
      responses:
        "201":
          description: Journey consent persisted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialGroupJourneyShare" }
        "404":
          description: Group or owned journey not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/groups/{groupId}/shares/{journeyId}:
    delete:
      operationId: revokeMySocialGroupJourneyShare
      tags: [social]
      summary: Revoke the current user's per-group journey consent
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
        - name: journeyId
          in: path
          required: true
          description: Journey identity is the owner's habit ID
          schema: { type: integer }
      responses:
        "204":
          description: Consent revoked and no longer visible to group members
        "404":
          description: Share not found or not owned by the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/groups/{groupId}/encouragements:
    get:
      operationId: listSocialGroupEncouragements
      tags: [social]
      summary: List recent group cheers using the existing group reactions store
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Recent member-to-member or group-wide encouragements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SocialGroupEncouragement" }
        "404":
          description: Group not found or current user is not a member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createSocialGroupEncouragement
      tags: [social]
      summary: Send a short group cheer to a member or the group
      description: Uses group_reactions; requestId and a persisted per-recipient minute cooldown prevent retry duplicates and spam. No rewards or XP are granted.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialGroupEncouragementInput" }
      responses:
        "201":
          description: Group encouragement recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialGroupEncouragement" }
        "403":
          description: Sender or recipient is not an eligible group member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Group not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Cooldown or requestId prevents a duplicate encouragement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /social/groups/{groupId}/cover:
    get:
      operationId: getSocialGroupCover
      tags: [social]
      summary: Stream the private group cover image to current group members
      description: Cover bytes are served only after membership authorization; never use a public object URL.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Authorized private image bytes
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: Cover not found or user is not a group member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: updateSocialGroupCover
      tags: [social]
      summary: Set or remove the private group cover image
      description: Owner only. The object path must belong to an authenticated upload; null removes the cover.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialGroupCoverUpdate" }
      responses:
        "200":
          description: Updated private cover reference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SocialGroupCover" }
        "403":
          description: Only the group owner may change the cover
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Group or owned uploaded image not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups:
    get:
      operationId: listMyGroups
