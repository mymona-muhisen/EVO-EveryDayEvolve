openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Habit Journey API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Current user profile and onboarding
  - name: habits
    description: Habit CRUD
  - name: checkins
    description: Daily habit check-ins and streak recovery
  - name: timeEntries
    description: Free-form time tracking
  - name: memories
    description: Photo/note journal entries
  - name: rewards
    description: User-defined real-world rewards
  - name: wallet
    description: Coin balance and transaction history
  - name: character
    description: Character catalog, ownership, and equipping
  - name: decorations
    description: Coin-purchasable island decorations and habit placements
  - name: journey
    description: Level/XP journey map progress
  - name: dashboard
    description: Aggregate "safe wow" summary endpoints
  - name: daily
    description: Durable daily habit execution, reflection, and consistency
  - name: groups
    description: Simplified social challenges
  - name: ai
    description: Hybrid rule-engine + LLM coach endpoints
  - name: Storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current user profile (JIT-provisions on first call)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update current user profile / onboarding fields
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /habits:
    get:
      operationId: listHabits
      tags: [habits]
      summary: List habits for the current user
      parameters:
        - name: isActive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Habits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Habit" }
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }

  /habits/{habitId}:
    get:
      operationId: getHabit
      tags: [habits]
      summary: Get a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Habit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    patch:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Habit" }
        "409":
          description: The habit target has changed since the expected target value was read; request a new suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/journey:
    get:
      operationId: getHabitJourney
      tags: [habits]
      summary: Get the habit-specific 22-day journey and scheduled thresholds
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Journey and its per-day plans; legacy habits may have no journey
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitJourney" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: startHabitJourney
      tags: [habits]
      summary: Start an existing legacy habit's 22-calendar-day journey
      description: >
        Starts at today in the owner's timezone using the habit's stored plan and cadence.
        The operation is idempotent: an existing journey is returned unchanged. The server
        owns all dates and plan snapshots; no check-in rewards or journey unlocks are granted.
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Started journey or the existing journey, unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitJourney" }
        "400":
          description: The existing journey definition is incomplete or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/daily/{date}:
    get:
      operationId: getDailyHabitDay
      tags: [daily]
      summary: Get a habit's durable execution state and immutable plan for a local date
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily execution and consistency state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHabitState" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Date is outside the journey or not eligible for execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/daily/actions:
    post:
      operationId: changeDailyHabitExecution
      tags: [daily]
      summary: Start, pause, resume, finish, update progress, or complete today's habit execution
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyHabitExecutionInput" }
      responses:
        "200":
          description: Durable execution state and any new reward delta
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHabitActionResult" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Stale revision, invalid state transition, future date, or rest day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/daily/{date}/reflection:
    patch:
      operationId: saveDailyHabitReflection
      tags: [daily]
      summary: Save completion reflection or a real missed-day reason
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyHabitReflectionInput" }
      responses:
        "200":
          description: Updated execution, check-in if successful, and actual newly granted rewards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHabitActionResult" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Date cannot be reflected or completion is not eligible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/daily/{date}/adaptation-decision:
    post:
      operationId: recordDailyAdaptationDecision
      tags: [daily]
      summary: Persist whether the user accepted or rejected the adaptation shown for a day
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyAdaptationDecisionInput" }
      responses:
        "200":
          description: Persisted adaptation decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyHabitState" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Date has no persisted missed-day adaptation context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /daily/overview:
    get:
      operationId: getDailyOverview
      tags: [daily]
      summary: Aggregate elapsed scheduled dates, today's execution, and reward milestones by active habit
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Per-habit daily consistency summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyOverview" }

  /checkins:
    get:
      operationId: listHabitCheckins
      tags: [checkins]
      summary: List check-ins for a habit
      parameters:
        - name: habitId
          in: query
          required: true
          schema: { type: integer }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Check-ins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Checkin" }

  /habits/{habitId}/checkins:
    post:
      operationId: createCheckin
      tags: [checkins]
      summary: Record a check-in for a habit (updates streak and awards coins)
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckinResult" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A successful check-in cannot be changed to incomplete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/checkins/{date}:
    patch:
      operationId: updateCheckinReflection
      tags: [checkins]
      summary: Add or update reflection and missed-day reason for a recorded check-in
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckinReflection" }
      responses:
        "200":
          description: Updated reflection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkin" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/adaptation:
    get:
      operationId: getHabitAdaptation
      tags: [habits]
      summary: Deterministic habit target suggestion based on check-in history
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Adaptation suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitAdaptation" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/recover-streak:
    post:
      operationId: recoverStreak
      tags: [checkins]
      summary: Spend coins to restore a just-broken streak
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Streak recovered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoverStreakResult" }
        "400":
          description: Not eligible or insufficient coins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [timeEntries]
      summary: List time entries
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
        - name: habitId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Time entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TimeEntry" }
    post:
      operationId: createTimeEntry
      tags: [timeEntries]
      summary: Log a time entry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeEntryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }

  /time-entries/summary:
    get:
      operationId: getTimeEntriesSummary
      tags: [timeEntries]
      summary: Get total minutes tracked on a given day, grouped by habit
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntriesSummary" }

  /time-entries/{timeEntryId}:
    patch:
      operationId: updateTimeEntry
      tags: [timeEntries]
      summary: Correct an existing time entry
      parameters:
        - name: timeEntryId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimeEntryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }
    delete:
      operationId: deleteTimeEntry
      tags: [timeEntries]
      summary: Delete a time entry
      parameters:
        - name: timeEntryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /time-tracking/session:
    get:
      operationId: getTrackingSession
      tags: [timeEntries]
      summary: Get the current day's tracking state
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Session or null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingSessionResult" }
    post:
      operationId: changeTrackingSession
      tags: [timeEntries]
      summary: Start, pause, resume, finish, or change the next check-in interval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackingSessionInput" }
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackingSessionResult" }

  /time-tracking/check-in:
    post:
      operationId: createTrackingCheckin
      tags: [timeEntries]
      summary: Categorize the most recent tracking interval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrackingCheckinInput" }
      responses:
        "201":
          description: Recorded interval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimeEntry" }

  /time-tracking/day:
    get:
      operationId: getTrackedDay
      tags: [timeEntries]
      summary: Timeline and deterministic category totals for a day
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Tracked day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedDay" }

  /time-tracking/analysis:
    get:
      operationId: getTrackedDayAnalysis
      tags: [timeEntries]
      summary: Supportive analysis of a completed or in-progress tracked day
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Day analysis with deterministic fallback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrackedDayAnalysis" }

  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List memory journal entries
      parameters:
        - name: habitId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Memory" }
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a memory (optionally with an uploaded photo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }

  /memories/{memoryId}:
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete a memory
      parameters:
        - name: memoryId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rewards:
    get:
      operationId: listRewards
      tags: [rewards]
      summary: List rewards defined by the user
      responses:
        "200":
          description: Rewards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reward" }
    post:
      operationId: createReward
      tags: [rewards]
      summary: Create a reward
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }

  /rewards/{rewardId}:
    patch:
      operationId: updateReward
      tags: [rewards]
      summary: Update a reward
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RewardUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reward" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteReward
      tags: [rewards]
      summary: Delete a reward
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /rewards/{rewardId}/redeem:
    post:
      operationId: redeemReward
      tags: [rewards]
      summary: Redeem a reward by spending coins
      parameters:
        - name: rewardId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RedeemRewardResult" }
        "400":
          description: Insufficient coins or already redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get coin balance and weekly earn/spend totals
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Wallet" }

  /wallet/transactions:
    get:
      operationId: listWalletTransactions
      tags: [wallet]
      summary: List recent coin transactions
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CoinTransaction" }

  /character/catalog:
    get:
      operationId: listCharacterCatalog
      tags: [character]
      summary: List all character items with owned/equipped/affordable state
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CharacterItem" }

  /character/me:
    get:
      operationId: getMyCharacter
      tags: [character]
      summary: Get current level/XP and equipped loadout
      responses:
        "200":
          description: My character
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyCharacter" }

  /character/items/{itemId}/purchase:
    post:
      operationId: purchaseCharacterItem
      tags: [character]
      summary: Purchase a character item with coins
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Purchased
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterItem" }
        "400":
          description: Insufficient coins or already owned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /character/items/{itemId}/equip:
    post:
      operationId: equipCharacterItem
      tags: [character]
      summary: Equip an owned character item
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Equipped
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CharacterItem" }
        "400":
          description: Item not owned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /decorations/catalog:
    get:
      operationId: listDecorationCatalog
      tags: [decorations]
      summary: List purchasable island decorations and ownership state
      responses:
        "200":
          description: Decoration catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DecorationItem" }

  /decorations/items/{itemId}/purchase:
    post:
      operationId: purchaseDecorationItem
      tags: [decorations]
      summary: Purchase a decoration with coins
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecorationPurchaseInput" }
      responses:
        "200":
          description: Purchased, already owned, or an idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecorationPurchase" }
        "400":
          description: Invalid input or insufficient coins
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Decoration not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency key was committed for a different decoration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/decorations:
    get:
      operationId: getHabitDecorations
      tags: [decorations]
      summary: Get a habit's island decoration placements
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Habit decoration placements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitDecorations" }
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /habits/{habitId}/decorations/{itemId}:
    put:
      operationId: placeHabitDecoration
      tags: [decorations]
      summary: Place or move an owned decoration in a bounded island slot
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitDecorationPlacementInput" }
      responses:
        "200":
          description: Placed decoration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyDecoration" }
        "400":
          description: Invalid island or slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Habit, decoration, or ownership not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Island slot is occupied by another decoration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: removeHabitDecoration
      tags: [decorations]
      summary: Remove a habit decoration placement without refunding or revoking ownership
      parameters:
        - name: habitId
          in: path
          required: true
          schema: { type: integer }
        - name: itemId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed (including when no placement existed)
        "404":
          description: Habit not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /journey/progress:
    get:
      operationId: getJourneyProgress
      tags: [journey]
      summary: Get level/XP and milestone map progress
      responses:
        "200":
          description: Journey progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JourneyProgress" }

  /dashboard/today:
    get:
      operationId: getDashboardToday
      tags: [dashboard]
      summary: Aggregate home-screen summary for today
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardToday" }

  /dashboard/calendar:
    get:
      operationId: getDashboardCalendar
      tags: [dashboard]
      summary: Daily completion heatmap data for a calendar month
      parameters:
        - name: month
          in: query
          required: true
          description: "Format YYYY-MM"
          schema: { type: string }
      responses:
        "200":
          description: Calendar days
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DashboardCalendarDay" }

  /groups:
    get:
      operationId: listMyGroups
      tags: [groups]
      summary: List groups/challenges the current user belongs to
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a group challenge (creator auto-joins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }

  /groups/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a group challenge by invite code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinGroupInput" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404":
          description: Invalid invite code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group detail with members ranked by progress (leaderboard)
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Group detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupDetail" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /groups/{groupId}/reactions:
    get:
      operationId: listGroupReactions
      tags: [groups]
      summary: List recent cheer reactions in a group
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Reactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupReaction" }
    post:
      operationId: createGroupReaction
      tags: [groups]
      summary: Send a cheer/reaction to the group or a specific member
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupReactionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupReaction" }

  /ai/breakdown-goal:
    post:
      operationId: aiBreakdownGoal
      tags: [ai]
      summary: Rule engine computes a ramp-up milestone plan; LLM phrases it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiBreakdownGoalInput" }
      responses:
        "200":
          description: Suggested milestone plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiBreakdownGoalResult" }

  /ai/habit-builder:
    post:
      operationId: aiHabitBuilder
      tags: [ai]
      summary: Build an editable habit suggestion using deterministic target math
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HabitBuilderInput" }
      responses:
        "200":
          description: Habit suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitBuilderResult" }

  /ai/daily-insight:
    get:
      operationId: aiDailyInsight
      tags: [ai]
      summary: Rule engine computes a trend metric from recent activity; LLM phrases a coaching insight
      responses:
        "200":
          description: Insight
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiDailyInsightResult" }

  /ai/checkin-feedback:
    post:
      operationId: aiCheckinFeedback
      tags: [ai]
      summary: LLM phrases a reaction to a just-recorded check-in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiCheckinFeedbackInput" }
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiCheckinFeedbackResult" }

  /ai/relapse-recovery:
    post:
      operationId: aiRelapseRecovery
      tags: [ai]
      summary: Rule engine computes a reduced restart target; LLM phrases compassionate encouragement
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AiRelapseRecoveryInput" }
      responses:
        "200":
          description: Recovery plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiRelapseRecoveryResult" }

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public -- no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: "Object path within the private object dir (e.g. uploads/some-uuid)."
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    User:
      type: object
      required: [id, displayName, avatarEmoji, level, xp, xpToNextLevel, coins, motivationStyle, primaryGoalCategory, onboardingCompleted, timezone, createdAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        avatarEmoji: { type: string }
        level: { type: integer }
        xp: { type: integer }
        xpToNextLevel: { type: integer }
        coins: { type: integer }
        motivationStyle: { type: string, enum: [encouraging, tough_love, data_driven] }
        primaryGoalCategory: { type: ["string", "null"], enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom, null] }
        onboardingCompleted: { type: boolean }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }
        avatarEmoji: { type: string }
        motivationStyle: { type: string, enum: [encouraging, tough_love, data_driven] }
        primaryGoalCategory: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        onboardingCompleted: { type: boolean }
        timezone: { type: string }

    HabitMilestone:
      type: object
      required: [title, description, targetValue, order]
      properties:
        title: { type: string }
        description: { type: string }
        targetValue: { type: number }
        order: { type: integer }
    Habit:
      type: object
      required: [id, title, emoji, category, cadence, customDays, unit, targetValue, minimumValue, busyDayValue, baselineValue, successLimitValue, cueType, cueTime, cue, startAction, friction, minimumFloor, journeyStartDate, journeyLength, rewardId, difficulty, goalType, isActive, currentStreak, longestStreak, lastCheckinDate, milestones, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        emoji: { type: string }
        category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        cadence: { type: string, enum: [daily, weekdays, weekly, custom_days] }
        customDays:
          type: ["array", "null"]
          items: { type: integer, minimum: 0, maximum: 6 }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        executionType: { type: ["string", "null"], enum: [duration, count, boolean, limit, null], description: Nullable for legacy records; inferred from unit and goalType when consumed. }
        targetValue: { type: number }
        minimumValue: { type: ["number", "null"] }
        busyDayValue: { type: ["number", "null"] }
        baselineValue: { type: ["number", "null"] }
        successLimitValue: { type: ["number", "null"] }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        friction: { type: ["string", "null"] }
        minimumFloor: { type: ["number", "null"], minimum: 0 }
        journeyStartDate: { type: ["string", "null"], format: date }
        journeyLength: { type: ["integer", "null"], minimum: 1, maximum: 22 }
        rewardId: { type: ["integer", "null"], minimum: 1 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        goalType: { type: string, enum: [build, quit] }
        isActive: { type: boolean }
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        lastCheckinDate: { type: ["string", "null"], format: date }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/HabitMilestone" }
        createdAt: { type: string, format: date-time }
    HabitInput:
      type: object
      required: [title, emoji, category, cadence, unit, targetValue, difficulty, goalType]
      properties:
        title: { type: string, minLength: 1 }
        emoji: { type: string }
        category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        cadence: { type: string, enum: [daily, weekdays, weekly, custom_days] }
        customDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        executionType: { type: string, enum: [duration, count, boolean, limit] }
        targetValue: { type: number, minimum: 0 }
        minimumValue: { type: number, minimum: 0 }
        busyDayValue: { type: number, minimum: 0 }
        baselineValue: { type: number, minimum: 0 }
        successLimitValue: { type: number, minimum: 0 }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        friction: { type: ["string", "null"] }
        minimumFloor: { type: number, minimum: 0 }
        journeyStartDate: { type: string, format: date }
        journeyLength: { type: integer, minimum: 1, maximum: 22 }
        rewardId: { type: integer, minimum: 1 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        goalType: { type: string, enum: [build, quit] }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/HabitMilestone" }
    HabitUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        emoji: { type: string }
        category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        cadence: { type: string, enum: [daily, weekdays, weekly, custom_days] }
        customDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        executionType: { type: string, enum: [duration, count, boolean, limit] }
        targetValue: { type: number, minimum: 0 }
        minimumValue: { type: number, minimum: 0 }
        busyDayValue: { type: ["number", "null"], minimum: 0 }
        baselineValue: { type: ["number", "null"], minimum: 0 }
        successLimitValue: { type: ["number", "null"], minimum: 0 }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        friction: { type: ["string", "null"] }
        minimumFloor: { type: ["number", "null"], minimum: 0 }
        journeyStartDate: { type: ["string", "null"], format: date }
        journeyLength: { type: ["integer", "null"], minimum: 1, maximum: 22 }
        rewardId: { type: ["integer", "null"], minimum: 1 }
        expectedTargetValue:
          type: number
          description: If provided with targetValue, update only when the stored target still equals this value
        expectedMinimumValue: { type: number, description: Compare-and-set guard for minimumValue updates }
        expectedSuccessLimitValue: { type: ["number", "null"], description: Compare-and-set guard for successLimitValue updates }
        difficulty: { type: string, enum: [easy, medium, hard] }
        goalType: { type: string, enum: [build, quit] }
        isActive: { type: boolean }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/HabitMilestone" }

    Checkin:
      type: object
      required: [id, habitId, date, completed, value, note, moodRating, difficulty, missedReason, targetSnapshot, minimumSnapshot, successLimitSnapshot, goalTypeSnapshot, targetCompleted, coinsEarned, xpEarned, createdAt]
      properties:
        id: { type: integer }
        habitId: { type: integer }
        date: { type: string, format: date }
        completed: { type: boolean }
        value: { type: ["number", "null"] }
        note: { type: ["string", "null"] }
        moodRating: { type: ["integer", "null"] }
        difficulty: { type: ["string", "null"], enum: [easy, normal, hard, very_hard, null] }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
        targetSnapshot: { type: ["number", "null"] }
        minimumSnapshot: { type: ["number", "null"] }
        successLimitSnapshot: { type: ["number", "null"] }
        goalTypeSnapshot: { type: ["string", "null"], enum: [build, quit, null] }
        targetCompleted: { type: boolean }
        coinsEarned: { type: integer }
        xpEarned: { type: ["integer", "null"], description: Exact XP persisted atomically with newly granted check-in rewards; null means historical earnings are unknown }
        createdAt: { type: string, format: date-time }
    CheckinInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        completed: { type: boolean, description: Legacy compatibility; success is determined server-side when value is provided }
        value: { type: number }
        note: { type: string }
        moodRating: { type: integer, minimum: 1, maximum: 5 }
        difficulty: { type: string, enum: [easy, normal, hard, very_hard] }
        missedReason: { type: string, enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other] }
    CheckinReflection:
      type: object
      properties:
        note: { type: ["string", "null"] }
        moodRating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        difficulty: { type: ["string", "null"], enum: [easy, normal, hard, very_hard, null] }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
    HabitAdaptation:
      type: object
      required: [habitId, reason, suggestion, expectedTargetValue, expectedMinimumValue, expectedSuccessLimitValue, targetValue, minimumValue, newSuccessLimitValue, busyDayValue, missedReason, actions, phrasing, coachMessage, missedDays]
      properties:
        habitId: { type: integer }
        reason: { type: string, enum: [repeated_hard, repeated_easy, missed_reasons, steady, no_history] }
        suggestion: { type: boolean }
        expectedTargetValue: { type: number }
        expectedMinimumValue: { type: number }
        expectedSuccessLimitValue: { type: ["number", "null"] }
        targetValue: { type: number }
        minimumValue: { type: number }
        newSuccessLimitValue: { type: ["number", "null"] }
        busyDayValue: { type: ["number", "null"] }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
        actions: { $ref: "#/components/schemas/HabitAdaptationActions" }
        phrasing: { $ref: "#/components/schemas/HabitAdaptationPhrasing" }
        coachMessage: { type: string }
        missedDays: { type: integer, minimum: 0 }
    HabitAdaptationPhrasing:
      type: object
      required: [headline, explanation, next_step, encouragement]
      properties:
        headline: { type: string }
        explanation: { type: string }
        next_step: { type: string }
        encouragement: { type: string }
    HabitAdaptationActions:
      type: object
      required: [cue, startAction, busyDayValue]
      properties:
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        busyDayValue: { type: ["number", "null"] }
    HabitBuilderInput:
      type: object
      required: [intent, requestedDuration, unit]
      properties:
        intent: { type: string, minLength: 1 }
        requestedDuration: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        goalType: { type: string, enum: [build, quit] }
        baselineValue: { type: number, minimum: 0 }
        friction: { type: string, minLength: 1, description: Optional user-identified obstacle used only to generate one grounded tip }
        trackingContext:
          description: Optional category/unit hints only; baseline is resolved from the supplied user baseline or server-owned matching tracking rows
          type: object
          properties:
            category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
            unit: { type: string, enum: [minutes, count, pages, custom] }
    HabitBuilderResult:
      type: object
      required: [title, category, goalType, unit, originalGoal, understoodGoal, baselineValue, targetValue, minimumValue, busyDayValue, successLimitValue, minimumFloor, cueType, cueTime, cue, startAction, needsBaseline, reason, coachMessage, frictionTip, source]
      properties:
        title: { type: string }
        category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        goalType: { type: string, enum: [build, quit] }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        originalGoal: { type: string }
        understoodGoal: { type: string }
        baselineValue: { type: ["number", "null"] }
        targetValue: { type: number }
        minimumValue: { type: number }
        busyDayValue: { type: number }
        successLimitValue: { type: ["number", "null"] }
        minimumFloor: { type: number, minimum: 0 }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"] }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        needsBaseline: { type: boolean }
