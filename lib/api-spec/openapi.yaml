  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public -- no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: "Object path within the private object dir (e.g. uploads/some-uuid)."
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    User:
      type: object
      required: [id, displayName, avatarEmoji, level, xp, xpToNextLevel, coins, motivationStyle, primaryGoalCategory, onboardingCompleted, timezone, createdAt]
      properties:
        id: { type: string }
        displayName: { type: string }
        avatarEmoji: { type: string }
        level: { type: integer }
        xp: { type: integer }
        xpToNextLevel: { type: integer }
        coins: { type: integer }
        motivationStyle: { type: string, enum: [encouraging, tough_love, data_driven] }
        primaryGoalCategory: { type: ["string", "null"], enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom, null] }
        onboardingCompleted: { type: boolean }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
    UserUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }
        avatarEmoji: { type: string }
        motivationStyle: { type: string, enum: [encouraging, tough_love, data_driven] }
        primaryGoalCategory: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        onboardingCompleted: { type: boolean }
        timezone: { type: string }

    HabitMilestone:
      type: object
      required: [title, description, targetValue, order]
      properties:
        title: { type: string }
        description: { type: string }
        targetValue: { type: number }
        order: { type: integer }
    Habit:
      type: object
      required: [id, title, emoji, category, cadence, customDays, unit, targetValue, minimumValue, busyDayValue, baselineValue, successLimitValue, cueType, cueTime, cue, startAction, friction, minimumFloor, journeyStartDate, journeyLength, rewardId, difficulty, goalType, isActive, currentStreak, longestStreak, lastCheckinDate, milestones, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        emoji: { type: string }
        category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        cadence: { type: string, enum: [daily, weekdays, weekly, custom_days] }
        customDays:
          type: ["array", "null"]
          items: { type: integer, minimum: 0, maximum: 6 }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        executionType: { type: ["string", "null"], enum: [duration, count, boolean, limit, null], description: Nullable for legacy records; inferred from unit and goalType when consumed. }
        targetValue: { type: number }
        minimumValue: { type: ["number", "null"] }
        busyDayValue: { type: ["number", "null"] }
        baselineValue: { type: ["number", "null"] }
        successLimitValue: { type: ["number", "null"] }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        friction: { type: ["string", "null"] }
        minimumFloor: { type: ["number", "null"], minimum: 0 }
        journeyStartDate: { type: ["string", "null"], format: date }
        journeyLength: { type: ["integer", "null"], minimum: 1, maximum: 22 }
        journeyCompletedAt:
          type: ["string", "null"]
          format: date-time
          description: Server-recorded journey completion instant; optional for compatibility with older servers.
        rewardId: { type: ["integer", "null"], minimum: 1 }
        difficulty: { type: string, enum: [easy, medium, hard] }
        goalType: { type: string, enum: [build, quit] }
        isActive: { type: boolean }
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        lastCheckinDate: { type: ["string", "null"], format: date }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/HabitMilestone" }
        createdAt: { type: string, format: date-time }
    HabitInput:
      type: object
      additionalProperties: false
      required: [title, emoji, category, cadence, unit, targetValue, difficulty, goalType]
      properties:
        title: { type: string, minLength: 1 }
        emoji: { type: string }
        category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        cadence: { type: string, enum: [daily, weekdays, weekly, custom_days] }
        customDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        executionType: { type: string, enum: [duration, count, boolean, limit] }
        targetValue: { type: number, minimum: 0 }
        minimumValue: { type: number, minimum: 0 }
        busyDayValue: { type: number, minimum: 0 }
        baselineValue: { type: number, minimum: 0 }
        successLimitValue: { type: number, minimum: 0 }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        friction: { type: ["string", "null"] }
        minimumFloor: { type: number, minimum: 0 }
        journeyStartDate: { type: string, format: date }
        journeyLength: { type: integer, minimum: 1, maximum: 22 }
        rewardId: { type: integer, minimum: 1 }
        journeyReward: { $ref: "#/components/schemas/JourneyRewardInput" }
        difficulty: { type: string, enum: [easy, medium, hard] }
        goalType: { type: string, enum: [build, quit] }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/HabitMilestone" }
    StartHabitJourneyInput:
      type: object
      additionalProperties: false
      description: Optional real-world personal reward to attach while starting a legacy habit's journey.
      properties:
        journeyReward: { $ref: "#/components/schemas/JourneyRewardInput" }
    HabitUpdate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1 }
        emoji: { type: string }
        category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        cadence: { type: string, enum: [daily, weekdays, weekly, custom_days] }
        customDays:
          type: array
          items: { type: integer, minimum: 0, maximum: 6 }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        executionType: { type: string, enum: [duration, count, boolean, limit] }
        targetValue: { type: number, minimum: 0 }
        minimumValue: { type: number, minimum: 0 }
        busyDayValue: { type: ["number", "null"], minimum: 0 }
        baselineValue: { type: ["number", "null"], minimum: 0 }
        successLimitValue: { type: ["number", "null"], minimum: 0 }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        friction: { type: ["string", "null"] }
        minimumFloor: { type: ["number", "null"], minimum: 0 }
        journeyStartDate: { type: ["string", "null"], format: date }
        journeyLength: { type: ["integer", "null"], minimum: 1, maximum: 22 }
        rewardId: { type: ["integer", "null"], minimum: 1 }
        expectedTargetValue:
          type: number
          description: If provided with targetValue, update only when the stored target still equals this value
        expectedMinimumValue: { type: number, description: Compare-and-set guard for minimumValue updates }
        expectedSuccessLimitValue: { type: ["number", "null"], description: Compare-and-set guard for successLimitValue updates }
        difficulty: { type: string, enum: [easy, medium, hard] }
        goalType: { type: string, enum: [build, quit] }
        isActive: { type: boolean }
        milestones:
          type: array
          items: { $ref: "#/components/schemas/HabitMilestone" }

    Checkin:
      type: object
      required: [id, habitId, date, completed, value, note, moodRating, difficulty, missedReason, targetSnapshot, minimumSnapshot, successLimitSnapshot, goalTypeSnapshot, targetCompleted, coinsEarned, xpEarned, createdAt]
      properties:
        id: { type: integer }
        habitId: { type: integer }
        date: { type: string, format: date }
        completed: { type: boolean }
        value: { type: ["number", "null"] }
        note: { type: ["string", "null"] }
        moodRating: { type: ["integer", "null"] }
        difficulty: { type: ["string", "null"], enum: [easy, normal, hard, very_hard, null] }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
        targetSnapshot: { type: ["number", "null"] }
        minimumSnapshot: { type: ["number", "null"] }
        successLimitSnapshot: { type: ["number", "null"] }
        goalTypeSnapshot: { type: ["string", "null"], enum: [build, quit, null] }
        targetCompleted: { type: boolean }
        coinsEarned: { type: integer }
        xpEarned: { type: ["integer", "null"], description: Exact XP persisted atomically with newly granted check-in rewards; null means historical earnings are unknown }
        createdAt: { type: string, format: date-time }
    CheckinInput:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        completed: { type: boolean, description: Legacy compatibility; success is determined server-side when value is provided }
        value: { type: number }
        note: { type: string }
        moodRating: { type: integer, minimum: 1, maximum: 5 }
        difficulty: { type: string, enum: [easy, normal, hard, very_hard] }
        missedReason: { type: string, enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other] }
    CheckinReflection:
      type: object
      properties:
        note: { type: ["string", "null"] }
        moodRating: { type: ["integer", "null"], minimum: 1, maximum: 5 }
        difficulty: { type: ["string", "null"], enum: [easy, normal, hard, very_hard, null] }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
    HabitAdaptation:
      type: object
      required: [habitId, reason, suggestion, expectedTargetValue, expectedMinimumValue, expectedSuccessLimitValue, targetValue, minimumValue, newSuccessLimitValue, busyDayValue, missedReason, actions, phrasing, coachMessage, missedDays]
      properties:
        habitId: { type: integer }
        reason: { type: string, enum: [repeated_hard, repeated_easy, missed_reasons, steady, no_history] }
        suggestion: { type: boolean }
        expectedTargetValue: { type: number }
        expectedMinimumValue: { type: number }
        expectedSuccessLimitValue: { type: ["number", "null"] }
        targetValue: { type: number }
        minimumValue: { type: number }
        newSuccessLimitValue: { type: ["number", "null"] }
        busyDayValue: { type: ["number", "null"] }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
        actions: { $ref: "#/components/schemas/HabitAdaptationActions" }
        phrasing: { $ref: "#/components/schemas/HabitAdaptationPhrasing" }
        coachMessage: { type: string }
        missedDays: { type: integer, minimum: 0 }
    HabitAdaptationPhrasing:
      type: object
      required: [headline, explanation, next_step, encouragement]
      properties:
        headline: { type: string }
        explanation: { type: string }
        next_step: { type: string }
        encouragement: { type: string }
    HabitAdaptationActions:
      type: object
      required: [cue, startAction, busyDayValue]
      properties:
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        busyDayValue: { type: ["number", "null"] }
    HabitBuilderInput:
      type: object
      required: [intent, requestedDuration, unit]
      properties:
        intent: { type: string, minLength: 1 }
        requestedDuration: { type: number, exclusiveMinimum: 0 }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        goalType: { type: string, enum: [build, quit] }
        baselineValue: { type: number, minimum: 0 }
        friction: { type: string, minLength: 1, description: Optional user-identified obstacle used only to generate one grounded tip }
        trackingContext:
          description: Optional category/unit hints only; baseline is resolved from the supplied user baseline or server-owned matching tracking rows
          type: object
          properties:
            category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
            unit: { type: string, enum: [minutes, count, pages, custom] }
    HabitBuilderResult:
      type: object
      required: [title, category, goalType, unit, originalGoal, understoodGoal, baselineValue, targetValue, minimumValue, busyDayValue, successLimitValue, minimumFloor, cueType, cueTime, cue, startAction, needsBaseline, reason, coachMessage, frictionTip, source]
      properties:
        title: { type: string }
        category: { type: string, enum: [health, learning, productivity, mindfulness, social, creativity, finance, custom] }
        goalType: { type: string, enum: [build, quit] }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        originalGoal: { type: string }
        understoodGoal: { type: string }
        baselineValue: { type: ["number", "null"] }
        targetValue: { type: number }
        minimumValue: { type: number }
        busyDayValue: { type: number }
        successLimitValue: { type: ["number", "null"] }
        minimumFloor: { type: number, minimum: 0 }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"] }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        needsBaseline: { type: boolean }
        reason: { type: string }
        coachMessage: { type: string }
        frictionTip: { type: string }
        source: { type: string, enum: [ai, deterministic] }
    HabitJourney:
      type: object
      required: [habitId, startDate, length, total, completed, successful, currentDay, today, timezone, status, completedAt, consistency, missedDays, restDays, selectedReward, rewardUnlocked, finalEligibility, earnings, days]
      properties:
        habitId: { type: integer }
        startDate: { type: ["string", "null"], format: date }
        length: { type: integer }
        total: { type: integer }
        completed: { type: integer }
        successful: { type: integer }
        currentDay: { type: integer }
        today: { type: string, format: date, description: Authoritative local calendar date in the user's saved timezone }
        timezone: { type: string, description: Authoritative IANA timezone used to resolve today }
        status: { type: string, enum: [not_started, active, completed, expired] }
        completedAt: { type: ["string", "null"], format: date-time, description: Set once when final eligibility is met; never an XP or coin award }
        consistency:
          type: object
          required: [successfulDays, eligibleDays]
          properties:
            successfulDays: { type: integer, description: Real successful check-ins on elapsed scheduled dates only }
            eligibleDays: { type: integer, description: Elapsed scheduled dates only; rest and future dates are excluded }
        missedDays: { type: integer, description: Elapsed scheduled dates without a successful check-in }
        restDays: { type: integer, description: Rest dates in the fixed calendar snapshot }
        realReward:
          oneOf:
            - $ref: "#/components/schemas/JourneyReward"
            - type: "null"
          description: Optional private personal reward attached to this journey; absent on older servers.
        selectedReward:
          oneOf:
            - $ref: "#/components/schemas/HabitJourneyReward"
            - type: "null"
        rewardUnlocked: { type: boolean, description: Server-computed unlock state; selected rewards require a valid completed 22-day journey }
        finalEligibility:
          type: object
          required: [eligible, calendarDayRequired, finalScheduledDate, finalDateSuccessful, unmetReason]
          properties:
            eligible: { type: boolean }
            calendarDayRequired: { type: integer, enum: [22] }
            finalScheduledDate: { type: ["string", "null"], format: date, description: Last scheduled date in the immutable 22-calendar-day snapshot; it can precede day 22 when the final date is a rest day }
            finalDateSuccessful: { type: boolean, description: True only when the final scheduled date has a real successful check-in }
            unmetReason: { type: ["string", "null"], enum: [journey_not_started, calendar_days_remaining, final_scheduled_day_not_successful, no_scheduled_days, null] }
        earnings:
          type: object
          required: [xp, coins, xpComplete, unknownCheckins, coinHistoryMayBeIncomplete]
          properties:
            xp: { type: integer, description: Sum of persisted exact journey-attributed XP; unknown historical XP contributes zero and is signaled by xpComplete=false }
            coins: { type: integer, description: Sum of persisted check-in coin earnings; not inferred from wallet balances, but legacy zero entries may be ambiguous }
            xpComplete: { type: boolean, description: False when any successful historical check-in has unknown XP; historical XP is never estimated }
            unknownCheckins: { type: integer, description: Successful check-ins whose historical XP payout is unknown }
            coinHistoryMayBeIncomplete: { type: boolean, description: True when successful historical check-ins have no recorded coin amount or reward-granted evidence }
        days:
          type: array
          items: { $ref: "#/components/schemas/HabitDay" }
    HabitJourneyReward:
      type: object
      required: [id, title, emoji, coinCost, isRedeemed, redeemedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        emoji: { type: string }
        coinCost: { type: integer }
        isRedeemed: { type: boolean }
        redeemedAt: { type: ["string", "null"], format: date-time }
    HabitDay:
      type: object
      required: [date, dayNumber, scheduled, targetValue, minimumValue, busyDayValue, successLimitValue, goalType, checkin, status, actualValue, actualSeconds, difficulty, missedReason, recoveryEnabled, recoveryUsed, recoveryLimit, recoveryStatus]
      properties:
        date: { type: string, format: date }
        dayNumber: { type: integer }
        habitDayId: { type: ["integer", "null"], description: Saved habit_days row ID; null for legacy/synthetic days without a saved snapshot }
        memoryId: { type: ["integer", "null"], description: Owner's private memory ID for this day, if one exists }
        scheduled: { type: boolean }
        title: { type: ["string", "null"] }
        targetValue: { type: number }
        minimumValue: { type: number }
        busyDayValue: { type: ["number", "null"] }
        successLimitValue: { type: ["number", "null"] }
        goalType: { type: string, enum: [build, quit] }
        unit: { type: ["string", "null"], enum: [minutes, count, pages, custom, null] }
        executionType: { type: ["string", "null"], enum: [duration, count, boolean, limit, null] }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"] }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        status: { type: string, enum: [rest, future, pending, in_progress, paused, minimum_reached, target_reached, pending_reflection, completed, missed, recovery_available, recovery_active, recovered] }
        actualValue: { type: ["number", "null"], description: Self-reported or execution-recorded plan-unit quantity; timer duration alone is not activity proof }
        actualSeconds: { type: ["integer", "null"], description: Server-accounted active timer seconds, not independent proof of completed activity }
        difficulty: { type: ["string", "null"], enum: [easy, normal, hard, very_hard, null] }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
        recoveryEnabled: { type: boolean, description: Recovery Lite remains disabled }
        recoveryUsed: { type: integer }
        recoveryLimit: { type: integer }
        recoveryStatus: { type: ["string", "null"], enum: [recovery_available, recovery_active, recovered, null] }
        checkin: { oneOf: [{ $ref: "#/components/schemas/Checkin" }, { type: "null" }] }
    CheckinResult:
      allOf:
        - $ref: "#/components/schemas/Checkin"
        - type: object
          required: [newStreak, habit]
          properties:
            newStreak: { type: integer }
            habit: { $ref: "#/components/schemas/Habit" }

    DailyExecutionStatus:
      type: string
      enum: [pending, in_progress, paused, minimum_reached, target_reached, pending_reflection, completed, missed, recovery_available, recovery_active, recovered]
    DailyAdaptationDecision:
      type: string
      enum: [accepted, rejected]
    RewardMilestoneProgress:
      type: object
      required: [days, reached]
      properties:
        days: { type: integer, enum: [1, 5, 10, 15, 22] }
        reached: { type: boolean }
    DailyHabitState:
      type: object
      required: [habitId, date, dayNumber, scheduled, eligible, planRevision, title, executionType, unit, targetValue, minimumValue, busyDayValue, successLimitValue, goalType, cueType, cueTime, cue, startAction, status, actualValue, actualSeconds, elapsedSeconds, startedAt, lastResumedAt, pausedAt, pausedSeconds, finishedAt, missedReason, note, difficulty, revision, adaptationDecision, checkin, successfulDays, eligibleDays, rewardMilestones]
      properties:
        habitId: { type: integer }
        date: { type: string, format: date }
        dayNumber: { type: integer }
        habitDayId: { type: ["integer", "null"], description: Saved habit_days row ID when a saved plan snapshot exists }
        memoryId: { type: ["integer", "null"], description: Owner's private memory ID for this day, if one exists }
        scheduled: { type: boolean }
        eligible: { type: boolean }
        planRevision: { type: integer, minimum: 0 }
        title: { type: string }
        executionType: { type: string, enum: [duration, count, boolean, limit] }
        unit: { type: string, enum: [minutes, count, pages, custom] }
        targetValue: { type: number }
        minimumValue: { type: number }
        busyDayValue: { type: ["number", "null"] }
        successLimitValue: { type: ["number", "null"] }
        goalType: { type: string, enum: [build, quit] }
        cueType: { type: ["string", "null"], enum: [time, routine, custom, null] }
        cueTime: { type: ["string", "null"] }
        cue: { type: ["string", "null"] }
        startAction: { type: ["string", "null"] }
        status: { $ref: "#/components/schemas/DailyExecutionStatus" }
        actualValue: { type: ["number", "null"] }
        actualSeconds: { type: ["integer", "null"] }
        elapsedSeconds: { type: integer, minimum: 0 }
        startedAt: { type: ["string", "null"], format: date-time }
        lastResumedAt: { type: ["string", "null"], format: date-time }
        pausedAt: { type: ["string", "null"], format: date-time }
        pausedSeconds: { type: integer, minimum: 0 }
        finishedAt: { type: ["string", "null"], format: date-time }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
        note: { type: ["string", "null"] }
        difficulty: { type: ["string", "null"], enum: [easy, normal, hard, very_hard, null] }
        revision: { type: integer, minimum: 0 }
        adaptationDecision:
          anyOf:
            - { $ref: "#/components/schemas/DailyAdaptationDecision" }
            - { type: "null" }
        checkin:
          anyOf:
            - { $ref: "#/components/schemas/Checkin" }
            - { type: "null" }
        successfulDays: { type: integer, minimum: 0 }
        eligibleDays: { type: integer, minimum: 0 }
        rewardMilestones:
          type: array
          items: { $ref: "#/components/schemas/RewardMilestoneProgress" }
    DailyHabitExecutionInput:
      type: object
      required: [date, action, expectedRevision]
      properties:
        date: { type: string, format: date }
        action: { type: string, enum: [start, pause, resume, finish, update_progress, done] }
        expectedRevision: { type: integer, minimum: 0 }
        value: { type: number, minimum: 0, description: "Seconds for duration, item count for count, or usage for limit; actualValue is normalized to the plan unit (duration minutes) and actualSeconds stores the exact duration." }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
    DailyHabitReflectionInput:
      type: object
      properties:
        difficulty: { type: ["string", "null"], enum: [easy, normal, hard, very_hard, null] }
        note: { type: ["string", "null"], maxLength: 2000 }
        missedReason: { type: ["string", "null"], enum: [too_difficult, no_time, forgot, lost_motivation, unexpected, other, null] }
    RewardDelta:
      type: object
      required: [xp, coins]
      properties:
        xp: { type: integer, minimum: 0 }
        coins: { type: integer, minimum: 0 }
    DailyHabitActionResult:
      type: object
      required: [execution, rewardDelta]
      properties:
        execution: { $ref: "#/components/schemas/DailyHabitState" }
        rewardDelta: { $ref: "#/components/schemas/RewardDelta" }
    DailyAdaptationDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { $ref: "#/components/schemas/DailyAdaptationDecision" }
    DailyHabitOverviewItem:
      type: object
      required: [habitId, title, executionType, scheduledToday, successfulDays, eligibleDays, execution, rewardMilestones]
      properties:
        habitId: { type: integer }
        title: { type: string }
        executionType: { type: string, enum: [duration, count, boolean, limit] }
        scheduledToday: { type: boolean }
        successfulDays: { type: integer, minimum: 0 }
        eligibleDays: { type: integer, minimum: 0 }
