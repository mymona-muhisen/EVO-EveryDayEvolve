        reward: { $ref: "#/components/schemas/DashboardSectionStatus" }
        character: { $ref: "#/components/schemas/DashboardSectionStatus" }
        time: { $ref: "#/components/schemas/DashboardSectionStatus" }
        coach: { $ref: "#/components/schemas/DashboardSectionStatus" }
        social: { $ref: "#/components/schemas/DashboardSectionStatus" }
        memory: { $ref: "#/components/schemas/DashboardSectionStatus" }
    DashboardHome:
