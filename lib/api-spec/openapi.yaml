    HabitJourney:
      type: object
      required: [habitId, startDate, length, total, completed, successful, currentDay, today, timezone, status, completedAt, consistency, missedDays, restDays, selectedReward, rewardUnlocked, finalEligibility, earnings, days]
      properties:
        habitId: { type: integer }
        startDate: { type: ["string", "null"], format: date }
        length: { type: integer }
        total: { type: integer }
        completed: { type: integer }
        successful: { type: integer }
        currentDay: { type: integer }
        today: { type: string, format: date, description: Authoritative local calendar date in the user's saved timezone }
        timezone: { type: string, description: Authoritative IANA timezone used to resolve today }
        status: { type: string, enum: [not_started, active, completed, expired] }
        completedAt: { type: ["string", "null"], format: date-time, description: Set once when final eligibility is met; never an XP or coin award }
        consistency:
          type: object
          required: [successfulDays, eligibleDays]
          properties:
            successfulDays: { type: integer, description: Real successful check-ins on elapsed scheduled dates only }
            eligibleDays: { type: integer, description: Elapsed scheduled dates only; rest and future dates are excluded }
        missedDays: { type: integer, description: Elapsed scheduled dates without a successful check-in }
        restDays: { type: integer, description: Rest dates in the fixed calendar snapshot }
        selectedReward:
          oneOf:
            - $ref: "#/components/schemas/HabitJourneyReward"
            - type: "null"
        rewardUnlocked: { type: boolean, description: Server-computed unlock state; selected rewards require a valid completed 22-day journey }
        finalEligibility:
          type: object
          required: [eligible, calendarDayRequired, finalScheduledDate, finalDateSuccessful, unmetReason]
          properties:
            eligible: { type: boolean }
            calendarDayRequired: { type: integer, enum: [22] }
            finalScheduledDate: { type: ["string", "null"], format: date, description: Last scheduled date in the immutable 22-calendar-day snapshot; it can precede day 22 when the final date is a rest day }
            finalDateSuccessful: { type: boolean, description: True only when the final scheduled date has a real successful check-in }
            unmetReason: { type: ["string", "null"], enum: [journey_not_started, calendar_days_remaining, final_scheduled_day_not_successful, no_scheduled_days, null] }
        earnings:
          type: object
          required: [xp, coins, xpComplete, unknownCheckins, coinHistoryMayBeIncomplete]
          properties:
            xp: { type: integer, description: Sum of persisted exact journey-attributed XP; unknown historical XP contributes zero and is signaled by xpComplete=false }
            coins: { type: integer, description: Sum of persisted check-in coin earnings; not inferred from wallet balances, but legacy zero entries may be ambiguous }
            xpComplete: { type: boolean, description: False when any successful historical check-in has unknown XP; historical XP is never estimated }
            unknownCheckins: { type: integer, description: Successful check-ins whose historical XP payout is unknown }
            coinHistoryMayBeIncomplete: { type: boolean, description: True when successful historical check-ins have no recorded coin amount or reward-granted evidence }
        days:
          type: array
          items: { $ref: "#/components/schemas/HabitDay" }
