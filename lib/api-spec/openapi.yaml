        date: { type: string, format: date }
        totalMinutes: { type: integer }
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryMinutes" }
        topCategories:
          type: array
          items: { $ref: "#/components/schemas/CategoryMinutes" }
        entries:
          type: array
          items: { $ref: "#/components/schemas/TimeEntry" }
    ReplacementActivity:
