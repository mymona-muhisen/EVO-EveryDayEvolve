            - { $ref: "#/components/schemas/DashboardCompletion" }
            - { type: "null" }
        character:
          anyOf:
            - { $ref: "#/components/schemas/MyCharacter" }
            - { type: "null" }
        time:
          anyOf:
            - { $ref: "#/components/schemas/DashboardTimeSummary" }
            - { type: "null" }
        coach:
          anyOf:
            - { $ref: "#/components/schemas/DashboardCoach" }
