          type: array
          items:
            type: object
            required: [habitId, label, minutes]
            properties:
              habitId: { type: ["integer", "null"] }
              label: { type: string }
              minutes: { type: integer }

    Memory:
      type: object
      required: [id, habitId, note, photoUrl, date, createdAt, caption, visibility, updatedAt, journeyId, habitDayId, dayNumber, journeyLength, habitTitle, targetValue, actualValue, unit, difficulty]
      properties:
        id: { type: integer }
        habitId: { type: ["integer", "null"] }
        note: { type: ["string", "null"], description: Deprecated compatibility alias for caption; legacy note content is preserved }
        photoUrl: { type: ["string", "null"], description: Existing authenticated private-object URL behavior; a URL does not make the image public }
        date: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        caption: { type: ["string", "null"], maxLength: 300 }
        visibility: { type: string, enum: [private, friends, selected, public], description: Private for all V1 memories; other values are reserved for future social support }
        updatedAt: { type: string, format: date-time }
        journeyId: { type: ["integer", "null"], description: Server-derived journey identity (the habit ID); null for legacy memories not linked to a saved journey day }
        habitDayId: { type: ["integer", "null"], description: Saved habit_days row ID; null for legacy memories not linked to a saved journey day }
        dayNumber: { type: ["integer", "null"], description: Saved journey day number; null for legacy memories }
        journeyLength: { type: ["integer", "null"], description: Saved journey length; null for legacy memories }
        habitTitle: { type: ["string", "null"], description: Habit title from the saved day context; null for legacy memories }
        targetValue: { type: ["number", "null"], description: Target from the immutable saved day plan; null for legacy memories }
        actualValue: { type: ["number", "null"], description: Actual value from the real successful check-in; null for legacy memories }
        unit: { type: ["string", "null"], enum: [minutes, count, pages, custom, null] }
        difficulty: { type: ["string", "null"], enum: [easy, normal, hard, very_hard, null], description: Stored difficulty from the successful check-in; never created or changed by a memory }
    MemoryInput:
      type: object
      required: [habitId, date, photoObjectPath]
      properties:
        habitId: { type: integer, description: Habit and current journey identity; ownership is checked by the server }
        date: { type: string, format: date }
        photoObjectPath: { type: string, minLength: 1, description: "Private objectPath returned by POST /storage/uploads/request-url; ownership and file content are checked by the server" }
        caption: { type: ["string", "null"], maxLength: 300 }
        note: { type: ["string", "null"], maxLength: 300, deprecated: true, description: Deprecated caption alias for legacy clients; ignored when caption is also supplied }
        visibility: { type: string, enum: [private, friends, selected, public], default: private, description: Only private is accepted in V1; other enum values are reserved and rejected by the server }
    MemoryUpdate:
      type: object
      minProperties: 1
      properties:
        caption: { type: ["string", "null"], maxLength: 300, description: Set or clear the caption; explicit null clears it }
        note: { type: ["string", "null"], maxLength: 300, deprecated: true, description: Deprecated caption alias for legacy clients; ignored when caption is also supplied }

    Reward:
      type: object
      required: [id, habitId, title, emoji, coinCost, isRedeemed, redeemedAt, createdAt]
      properties:
        id: { type: integer }
        habitId: { type: ["integer", "null"] }
        title: { type: string }
        emoji: { type: string }
        coinCost: { type: integer }
        isRedeemed: { type: boolean }
        redeemedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    RewardInput:
      type: object
      required: [title, emoji, coinCost]
      properties:
        habitId: { type: integer }
        title: { type: string, minLength: 1 }
        emoji: { type: string }
        coinCost: { type: integer, minimum: 1 }
    RewardUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        emoji: { type: string }
        coinCost: { type: integer, minimum: 1 }
    JourneyRewardInput:
      type: object
      additionalProperties: false
      required: [title, type]
      description: User-selected personal goal only. It has no price in coins and does not initiate a purchase.
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string, enum: [physical, experience] }
        description: { type: string, maxLength: 2000 }
        imageObjectPath:
          type: string
          minLength: 1
          description: Private normalized object path returned by the existing photo upload flow; never a public URL or file bytes.
        estimatedValue: { type: number, minimum: 0 }
    JourneyRewardCreateInput:
      type: object
      additionalProperties: false
      required: [title, type]
      description: Create an owner-private real-world reward, optionally attached to an existing journey. Omit habitId to leave it unattached.
      properties:
        habitId: { type: ["integer", "null"], minimum: 1 }
        title: { type: string, minLength: 1 }
        type: { type: string, enum: [physical, experience] }
        description: { type: string, maxLength: 2000 }
        imageObjectPath:
          type: string
          minLength: 1
          description: Private normalized object path returned by the existing photo upload flow; never a public URL or file bytes.
        estimatedValue: { type: number, minimum: 0 }
    JourneyRewardUpdateInput:
      type: object
      additionalProperties: false
      required: [confirm]
      description: Updates are accepted only while status is pending and only with explicit confirmation=true.
      properties:
        confirm: { type: boolean, enum: [true] }
        habitId: { type: ["integer", "null"], minimum: 1, description: Attach to an existing owner journey or explicitly detach with null. }
        title: { type: string, minLength: 1 }
        type: { type: string, enum: [physical, experience] }
        description: { type: ["string", "null"], maxLength: 2000 }
        imageObjectPath:
          type: ["string", "null"]
          minLength: 1
          description: Private normalized object path returned by the existing photo upload flow; null removes the image.
        estimatedValue: { type: ["number", "null"], minimum: 0 }
    JourneyReward:
      type: object
      required: [id, habitId, title, type, description, imageUrl, estimatedValue, status, createdAt, updatedAt, unlockedAt, claimedAt, currentDay, daysRemaining]
      description: Owner-private personal reward and its server-computed 22-calendar-day progress. Image URL is a normalized private object path.
      properties:
        id: { type: integer }
        habitId: { type: ["integer", "null"] }
        title: { type: string }
        type: { type: string, enum: [physical, experience] }
        description: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"], description: Normalized private object path; clients serve it through the authenticated object route. }
        estimatedValue: { type: ["number", "null"], minimum: 0 }
        status: { type: string, enum: [pending, unlocked, claimed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        unlockedAt: { type: ["string", "null"], format: date-time }
        claimedAt: { type: ["string", "null"], format: date-time }
        currentDay: { type: ["integer", "null"], minimum: 0, maximum: 22, description: Current server-computed calendar day of the attached journey; null when unattached. }
        daysRemaining: { type: ["integer", "null"], minimum: 0, maximum: 22, description: Remaining calendar days in the attached 22-day journey; null when unattached. }
    RedeemRewardResult:
      type: object
      required: [reward, coinsRemaining]
      properties:
        reward: { $ref: "#/components/schemas/Reward" }
