        completedToday: { type: boolean }
        targetCompleted: { type: boolean }
        valueToday: { type: ["number", "null"] }
        currentStreak: { type: integer }
        scheduledToday: { type: boolean }
    DashboardToday:
      type: object
      required: [date, suggestedJourneyStartDate, activeHabitsCount, completedTodayCount, scheduledTodayCount, timeTrackedMinutesToday, coins, level, xp, xpToNextLevel, habitsToday]
      properties:
        date: { type: string, format: date, description: Today's calendar date in the user's saved timezone }
        suggestedJourneyStartDate: { type: string, format: date, description: Today in the user's saved timezone unless local hour is 21:00 or later, then tomorrow }
        activeHabitsCount: { type: integer }
        completedTodayCount: { type: integer }
        scheduledTodayCount: { type: integer }
        timeTrackedMinutesToday: { type: integer }
        coins: { type: integer }
        level: { type: integer }
        xp: { type: integer }
        xpToNextLevel: { type: integer }
        habitsToday:
          type: array
          items: { $ref: "#/components/schemas/DashboardHabitToday" }
        realRewards:
          type: array
          description: Optional private real-world journey reward cards; absent on older servers.
          items: { $ref: "#/components/schemas/DashboardJourneyRewardCard" }
    DashboardSectionStatus:
      type: string
      enum: [ready, empty, unavailable, stale]
    DashboardHomeState:
      type: string
      enum: [new_user, no_habit, tracking_active, tracking_paused, analysis_available, habit_not_started, habit_in_progress, minimum_reached, target_complete, missed_day, adaptation_required, journey_complete, rest_day, unavailable]
    DashboardFocus:
      type: object
      required: [habit, execution]
      properties:
        habit: { $ref: "#/components/schemas/Habit" }
        execution: { $ref: "#/components/schemas/DailyHabitState" }
    DashboardJourneyPreview:
      type: object
      required: [habitId, title, emoji, currentDay, journeyLength, status, successfulDays, eligibleDays, consistencyPercentage, daysRemaining, progressPercent, coinsEarned, xpEarned, earningsPartial]
      properties:
        habitId: { type: integer }
        title: { type: string }
        emoji: { type: string }
        currentDay: { type: integer, minimum: 0, maximum: 22 }
        journeyLength: { type: integer, enum: [22] }
        status: { type: string, enum: [upcoming, active, completed, expired] }
        successfulDays: { type: integer, minimum: 0 }
        eligibleDays: { type: integer, minimum: 0 }
        consistencyPercentage: { type: ["number", "null"], minimum: 0, maximum: 100 }
        daysRemaining: { type: integer, minimum: 0, maximum: 22 }
        progressPercent: { type: integer, minimum: 0, maximum: 100, description: Calendar progress only; not consistency or reward eligibility. }
        coinsEarned: { type: integer, minimum: 0 }
