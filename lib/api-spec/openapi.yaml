          type: array
          items: { $ref: "#/components/schemas/JourneyMilestone" }

    DashboardHabitToday:
      type: object
      required: [habitId, title, emoji, unit, targetValue, minimumValue, goalType, successLimitValue, completedToday, targetCompleted, valueToday, currentStreak, scheduledToday]
      properties:
        habitId: { type: integer }
        title: { type: string }
        emoji: { type: string }
        unit: { type: string }
        targetValue: { type: number }
        minimumValue: { type: number }
        goalType: { type: string, enum: [build, quit] }
