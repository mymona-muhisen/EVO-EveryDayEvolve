kind = "web"
previewPath = "/"
title = "EVO"
description = "EVO — Every Day, Evolve. A map-first habit-building and time-tracking companion with daily check-ins, day-linked memories, personal journey rewards, and AI coaching."
version = "1.0.0"
id = "artifacts/habit-journey"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18510

[services.development]
run = "pnpm --filter @workspace/habit-journey run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/habit-journey", "run", "build" ]
serve = "static"
publicDir = "artifacts/habit-journey/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18510"
BASE_PATH = "/"